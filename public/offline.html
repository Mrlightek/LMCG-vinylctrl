<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VinylCTRL — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .vinyl {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: conic-gradient(#1a1a1a 0deg, #2a2a2a 10deg, #1a1a1a 20deg);
      border: 3px solid #ff3c00;
      animation: spin 4s linear infinite;
      margin-bottom: 2rem;
      position: relative;
    }
    .vinyl::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      background: #ff3c00;
      border-radius: 50%;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { color: #888; font-size: 0.95rem; line-height: 1.6; max-width: 300px; }
    .retry {
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      background: #ff3c00;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="vinyl"></div>
  <h1>You're Offline</h1>
  <p>No signal right now. Your bookings and messages will sync when you're back online.</p>
  <button class="retry" onclick="window.location.reload()">Try Again</button>
</body>
</html>
